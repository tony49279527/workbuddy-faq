<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="760" height="548" rx="16" fill="#ffffff"/>
  <text x="380" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">个人版 vs 企业版</text>
  <text x="380" y="72" text-anchor="middle" font-size="13" fill="#656d76">核心区别在协作能力</text>

  <!-- 列头 -->
  <rect x="30" y="92" width="330" height="56" rx="12" fill="#eef0f3"/>
  <text x="195" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#656d76">个人版</text>
  <rect x="400" y="92" width="330" height="56" rx="12" fill="#2563eb"/>
  <text x="565" y="126" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">企业版</text>

  <!-- 行 -->
  <line x1="30" y1="172" x2="730" y2="172" stroke="#e4e7eb"/>
  <text x="58" y="196" font-size="14" fill="#656d76">登录方式</text>
  <text x="195" y="196" text-anchor="middle" font-size="15" fill="#2f3439">一个微信 / 手机号</text>
  <text x="565" y="196" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">企业账户统一管理</text>

  <line x1="30" y1="234" x2="730" y2="234" stroke="#e4e7eb"/>
  <text x="58" y="258" font-size="14" fill="#656d76">多人协作</text>
  <text x="195" y="258" text-anchor="middle" font-size="15" fill="#9ca3af">✗ 不支持</text>
  <text x="565" y="258" text-anchor="middle" font-size="15" fill="#16a34a" font-weight="600">✓ 支持</text>

  <line x1="30" y1="296" x2="730" y2="296" stroke="#e4e7eb"/>
  <text x="58" y="320" font-size="14" fill="#656d76">席位管理</text>
  <text x="195" y="320" text-anchor="middle" font-size="15" fill="#9ca3af">✗ 无</text>
  <text x="565" y="320" text-anchor="middle" font-size="15" fill="#16a34a" font-weight="600">✓ 可分配 / 调整</text>

  <line x1="30" y1="358" x2="730" y2="358" stroke="#e4e7eb"/>
  <text x="58" y="382" font-size="14" fill="#656d76">用量管理</text>
  <text x="195" y="382" text-anchor="middle" font-size="15" fill="#9ca3af">✗ 无</text>
  <text x="565" y="382" text-anchor="middle" font-size="15" fill="#16a34a" font-weight="600">✓ 可查看 / 分配</text>

  <line x1="30" y1="420" x2="730" y2="420" stroke="#e4e7eb"/>
  <text x="58" y="444" font-size="14" fill="#656d76">适合场景</text>
  <text x="195" y="444" text-anchor="middle" font-size="15" fill="#2f3439">个人先上手</text>
  <text x="565" y="444" text-anchor="middle" font-size="15" fill="#1f2328" font-weight="600">团队共同使用</text>

  <!-- 价格条 -->
  <rect x="400" y="486" width="330" height="50" rx="10" fill="#eff4ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="565" y="517" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700">企业版 ¥198 / 账号 / 月</text>
</svg>
